######### 订阅锚点 start #######
### 远程节点调用
##机场订阅
p: &p {type: http, interval: 86400, proxy: 国内直连, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 3600}}
##Cloudflare订阅
pc: &pc {type: http, interval: 7200, proxy: 国内直连, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 300}}
# 个人本地节点
pm: &pm {type: file, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 3600}}

######### 订阅锚点  end  #######

# 机场订阅信息
proxy-providers:
  VPN:
    <<: *p
    url: http:///127.0.0.1:3001/share/col/VPN?token=
  
  VPS:
    <<: *p
    url: http://127.0.0.1:3001/share/col/VPS?token=

  CloudFlare:
    <<: *p
    url: http://127.0.0.1:3001/share/col/CloudFlare?token=
# 自建节点信息
proxies:
  - {name: 直连, type: direct, udp: true}

# 全局配置 
port: 7890
socks-port: 7898
redir-port: 7891
mixed-port: 7893
tproxy-port: 7892
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
# interface-name: en0
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
  
# 数据库
# geodata-mode: true
# geodata-loader: standard
# geox-url:
#   geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
#   mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
#   geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat
# geo-auto-update: true
# geo-update-interval: 24

# UI控制面板
external-controller: 0.0.0.0:9090
secret: ""
# external-ui: "/etc/nikki/run/ui"
# external-ui-name: zashboard
# external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
external-ui: "/etc/nikki/run/ui"
external-ui-name: MetaCubeXD
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.wechatapp.com"
    - "+.vivox.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "Mijia Cloud"
    - "+.oray.com"
    - "rule-set:domain_private,domain_cn"

# 入站  
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.gw124.cn"
    - "+.waynesg.cc"
    - "+.880031.xyz"
    - "+.services.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - "time.*.com"
    - "rule-set:domain_cn,domain_private,domain_tailscale,domain_category-public-tracker,domain_cloudflare"
  #default-nameserver:
  #   - 223.5.5.5
  proxy-server-nameserver:
     - https://dns.alidns.com/dns-query
  nameserver:
    - 58.20.127.170
    - 58.20.127.238
    - 2408:8001:2000:3::ffff
    - 2408:8001:2000:3::eeee
    
######### 策略锚点 start #######
# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
pr: &pr {type: select, proxies: [香港, 台湾, 韩国, 日本, 新加坡, 美国, 其它地区, 备用线路, Automatic, Server｜Choose, Server｜Auto, CloudFlare,Snippets,国内直连]}
# 自动优选
auto: &auto {type: url-test, interval: 300, tolerance: 50, use: [VPN,VPS,CloudFlare]}
# SMART优选
#smart: &smart {type: smart, interval: 300, uselightgbm: true, collectdata: false, strategy: sticky-sessions,use: [VPN,VPS,CloudFlare]}
#负载均衡相关
balance: &balance {type: load-balance, lazy: false, tolerance: 50, interval: 300, strategy: consistent-hashing, use: [VPN,VPS,CloudFlare]}
# 自动回退相关
fallback: &fallback {type: fallback,interval: 900, use: [VPN,VPS,CloudFlare]}
# 手动选择相关
use: &use {type: select, use: [VPN,VPS,CloudFlare]}
######### 策略锚点  end  #######

