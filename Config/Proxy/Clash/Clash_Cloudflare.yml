######### 订阅锚点 start #######
### 远程节点调用
# 个人本地节点
## Cloudflare订阅
pc: &pc {type: http, interval: 7200, proxy: Direct, health-check: {enable: true, url: https://cp.cloudflare.com/generate_204, interval: 3600, timeout: 3000}}
## 网络节点
pn: &pn {type: http, interval: 3600, proxy: Direct, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 600, timeout: 3000}}
######### 订阅锚点 end #######

proxy-providers:
  Cloudflare:
    <<: *pc
    url: http://127.0.0.1:3001/share/col/CloudFlare?token=eKaQKfHio5sA0sMVFxS5S

  Internet:
    <<: *pn
    url: http://127.0.0.1:3001/share/sub/From%20the%20Internet?token=Mw-isaM8nMd4HzGNsaMci

proxies:
  - {name: 直连, type: direct, udp: true}

port: 7890
socks-port: 7898
redir-port: 7891
mixed-port: 7893
tproxy-port: 7892

allow-lan: true
bind-address: "*"

mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true

find-process-mode: strict
client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""

external-ui: "/etc/nikki/run/ui"
external-ui-name: MetaCubeXD
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80,8080-8880]
      override-destination: true
    TLS:
      ports: [443,8443]
    QUIC:
      ports: [443,8443]
  force-domain:
    - "+.v2ex.com"
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.wechatapp.com"
    - "+.vivox.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "Mijia Cloud"
    - "+.oray.com"
    - "rule-set:domain_private,domain_cn"
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.gw124.cn"
    - "+.services.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - "time.*.com"
    - "rule-set:domain_cn,domain_private,domain_tailscale,domain_category-public-tracker,domain_cloudflare"
  #default-nameserver:
  #  - 1.1.1.1
  #  - 8.8.8.8
  proxy-server-nameserver:
     - https://dns.alidns.com/dns-query
  nameserver:
    - 58.20.127.170
    - 58.20.127.238
    - 2408:8001:2000:3::ffff
    - 2408:8001:2000:3::eeee
  #nameserver:
    #- https://1.1.1.1/dns-query
    #- https://dns.google/dns-query

######### 策略锚点 #########
pr: &pr {type: select, proxies: [Japan, Korea, Singapore, United States, United Kingdom, Germany, Internet, Other, Available, Automatic, Cloudflare, Fallback, Direct]}

#########  策略组模板锚点 ######### 
# 自动优选 (Url-Test)
auto: &auto
  type: url-test
  url: "https://cp.cloudflare.com/generate_204"
  interval: 300
  tolerance: 50
  use: [Cloudflare, Internet]

# 手动选择 (Select)
use: &use
  type: select
  use: [Cloudflare, Internet]

# 智能优选 (Smart)
smart: &smart
  type: smart
  url: "https://cp.cloudflare.com/generate_204"
  interval: 300
  uselightgbm: true
  collectdata: false
  strategy: sticky-sessions
  use: [Cloudflare, Internet]

# 自动回退 (Fallback)
fallback: &fallback
  type: fallback
  url: "https://www.gstatic.com/generate_204"
  interval: 300
  use: [Cloudflare, Internet] 

# 负载均衡 (Load-Balance)
balance: &balance
  type: load-balance
  url: "https://cp.cloudflare.com/generate_204"
  interval: 300
  tolerance: 50
  strategy: consistent-hashing
  lazy: false
  use: [Cloudflare, Internet]

