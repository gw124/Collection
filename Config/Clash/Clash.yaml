#!name = OpenClash.yaml
#!date = 2025-04-14

# 基础配置
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: ""

# DNS配置
dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 8.8.4.4
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

######### 订阅锚点 start #######
### 远程节点调用
##机场订阅
p: &p {type: http, interval: 86400, proxy: 国内直连, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 3600}}
##Cloudflare订阅
pc: &pc {type: http, interval: 7200, proxy: 国内直连, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 300}}
# 个人本地节点
pm: &pm {type: file, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 3600}}

######### 订阅锚点  end  #######

# 机场订阅信息
proxy-providers:
  VPN:
    <<: *p
    url: http://127.0.0.1:3001
  
  VPS:
    <<: *pc
    url: http://127.0.0.1:3001

  CloudFlare:
    <<: *pc
    url: http://127.0.0.1:3001


# 自建节点信息
proxies:
  - {name: 直连, type: direct, udp: true}

######### 策略锚点 start #######
# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
pr: &pr {type: select, proxies: [香港, 韩国, 日本, 新加坡, 美国, 其它地区, Automatic, Server｜Choose, Server｜Auto, CloudFlare]}
# 自动优选
auto: &auto {type: url-test, interval: 300, tolerance: 50, use: [VPN,VPS,CloudFlare]}
# SMART优选
#smart: &smart {type: smart, interval: 300, uselightgbm: true, collectdata: false, strategy: sticky-sessions,use: [VPN,VPS,CloudFlare]}
#负载均衡相关
balance: &balance {type: load-balance, lazy: false, tolerance: 50, interval: 300, strategy: consistent-hashing, use: [VPN,VPS,CloudFlare]}
# 自动回退相关
fallback: &fallback {type: fallback,interval: 900, use: [VPN,VPS,CloudFlare]}
# 手动选择相关
use: &use {type: select, use: [VPN,VPS,CloudFlare]}
######### 策略锚点  end  #######

proxy-groups:
  - {name: YouTube, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/YouTube.png}
  - {name: Github, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/github.png}
  - {name: 社交媒体, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Twitter.png}
  - {name: 人工智能, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/OpenAI.png}
  - {name: NetFlix, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Netflix.png}
  - {name: Disney+, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/DisneyPlus.png}
  - {name: Google, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Google.png}
  - {name: Microsoft, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Microsoft.png}
  - {name: Apple 中国, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Apple.png, type: select, proxies: [国内直连, 全球代理]}
  - {name: Apple 国际, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/AppleTV.png}
  - {name: OneDrive, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/refs/heads/master/Color/GoogleDrive.png}
  - {name: Tiktok, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/TikTok.png}
  - {name: Telegram, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Telegram.png}
  - {name: 网络测试, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Speedtest.png, type: select, proxies: [国内直连, 全球代理]}
  - {name: 游戏服务, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Steam.png, type: select, proxies: [国内直连, 全球代理]}
  - {name: 香港, <<: *auto, filter: "(?i)HK|🇭🇰|香港", icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/HK.png}
  - {name: 韩国, <<: *auto, filter: "(?i)韩国|Kr|🇰🇷", icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/KR.png}
  - {name: 日本, <<: *auto, filter: "(?i)JP|🇯🇵|日本", icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/JP.png}
  - {name: 新加坡, <<: *auto, filter: "(?i)SG|🇸🇬|新加坡", icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/SG.png}
  - {name: 美国, <<: *auto, filter: "(?i)US|美国|🇺🇲|SanJose", icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/US.png}
  - {name: 其它地区, <<: *use, filter: "^(?!.*(🇺🇸|美国|🇭🇰|香港|🇸🇬|新加坡|🇰🇷|韩国|🇯🇵|日本|Oracle|RackNerd|ClawCloud|Other|CloudFlare|CF)).*", icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/UN.png}
  - {name: Automatic, <<: *auto, filter: ".*", icon: https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/refs/heads/master/Universal/Auto_Speed.png}
  - {name: Server｜Choose, <<: *use, filter: "(?i)Oracle|RackNerd|ClawCloud|Other", icon: https://cdn.jsdelivr.net/gh/gw124/IconsHub@Web/icon/Uncategorized/Ugos-pro.png}
  - {name: Server｜Auto, <<: *auto, filter: "(?i)Oracle|RackNerd|ClawCloud|Other", icon: https://cdn.jsdelivr.net/gh/gw124/IconsHub@Web/icon/Uncategorized/Ugos-pro.png}
  - {name: CloudFlare, <<: *balance, filter: "(?i)CloudFlare|CF", icon: https://cdn.jsdelivr.net/gh/gw124/IconsHub@Web/icon/Common/Cloudflare_A.png}
  - {name: 国内直连, type: url-test, proxies: [直连], icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/China.png}
  - {name: 全球代理, <<: *pr, icon: https://raw.githubusercontent.com/waynesg/mini/master/Color/Global.png}

# 规则匹配
rules:
  - SRC-IP-CIDR,10.10.10.12/32,DIRECT
  - PROCESS-NAME,qbittorrent,DIRECT
  - DOMAIN-KEYWORD,tracker,DIRECT
  - DST-PORT,34567,DIRECT
  - RULE-SET,wendirect,DIRECT
