name: Auto Sign-in

on:
  workflow_dispatch: # 允许手动在页面上点击触发，方便测试
  schedule:
    # 每天 UTC 时间 01:00 执行 (即北京时间早上 09:00)
    - cron: '0 4,10 * * *'

jobs:
  run_script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # 👈 降级到 3.9，完美兼容 ddddocr 的老版本
        
    - name: Install Cloudflare WARP
      run: |
        echo "🔄 添加 Cloudflare GPG 源..."
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        
        echo "🔄 安装 cloudflare-warp..."
        sudo apt-get update
        sudo apt-get install -y cloudflare-warp
        
        echo "✅ 初始化并注册 WARP..."
        # 注册设备并尝试初次连接
        sudo warp-cli --accept-tos registration new
        sudo warp-cli --accept-tos connect
        sleep 5 
        
    - name: Install System Dependencies for OCR
      run: |
        # ddddocr 依赖系统的图形库
        sudo apt-get install -y libgl1 libglib2.0-0
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # 锁定 ddddocr 以及兼容的 Pillow 和 numpy 老版本，解决 ImportError 报错
        pip install requests "ddddocr==1.4.3" "Pillow<10.0.0" "numpy<2.0.0"
        
    - name: Execute Sign-in Script
      env:
        # 映射账户变量
        ACCOUNTS: ${{ secrets.ACCOUNTS }}
        # 匿名模式变量（即使你在 Secrets 没建这个变量，脚本也会默认开启匿名）
        ANONYMOUS_MODE: ${{ secrets.ANONYMOUS_MODE }}
      run: |
        python sign.py
